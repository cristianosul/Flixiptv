<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FLIX PRO</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
:root{--red:#e50914;--bg:#0f0f0f;--bg2:#141414;--card:#1f1f1f;--gray:#808080}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:var(--bg);color:#fff;overflow-x:hidden}
header{position:fixed;top:0;width:100%;z-index:30;display:flex;align-items:center;gap:24px;padding:12px 4%;background:linear-gradient(180deg,#000 60%,transparent);transition:.3s}
header.scrolled{background:var(--bg2);box-shadow:0 2px 10px rgba(0,0,0,.8)}
.logo{color:var(--red);font-weight:900;font-size:28px;letter-spacing:-1px}
.tabs{display:flex;gap:8px;flex:1;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.12);border:none;color:#ccc;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.active{background:#fff;color:#000}
.tab span{opacity:.7;font-size:11px;margin-left:4px}
.search{margin-left:auto}
.search input{background:rgba(0,0,0,.6);border:1px solid #333;color:#fff;padding:8px 14px;border-radius:4px;width:200px;outline:none;transition:.2s}
.search input:focus{border-color:#fff;width:260px}
.hero{height:58vh;min-height:380px;position:relative;display:flex;align-items:flex-end;padding:0 4% 40px;background-size:cover;background-position:center top;transition:background-image .5s}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.9) 0,rgba(0,0,0,.4) 50%,transparent 85%)}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(0deg,var(--bg),transparent)}
.hero-content{position:relative;z-index:2;max-width:600px}
.badge{display:inline-block;background:var(--red);padding:3px 8px;border-radius:3px;font-size:10px;font-weight:900;margin-bottom:10px}
.hero h1{font-size:38px;line-height:1.1;margin-bottom:8px;text-shadow:2px 2px 8px #000}
.hero p{color:#bbb;font-size:14px;margin-bottom:14px}
.btn{padding:10px 22px;border:none;border-radius:4px;font-weight:800;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-play{background:#fff;color:#000}.btn-play:hover{background:rgba(255,255,255,.85)}
.btn-list{background:rgba(109,109,110,.7);color:#fff;margin-left:8px}
.rows{position:relative;z-index:2}
.row{padding:12px 4%}
.row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.row h2{font-size:18px;font-weight:700}
.row .count{color:var(--gray);font-size:12px}
.carousel{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:6px 0 14px;scroll-behavior:smooth}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:150px;max-width:150px;height:84px;background:var(--card);border-radius:4px;overflow:hidden;cursor:pointer;flex-shrink:0;position:relative;transition:transform .18s}
.card.movie{min-width:132px;max-width:132px;height:198px}
.card.serie{min-width:132px;max-width:132px;height:198px}
.card:hover{transform:scale(1.06);z-index:4;outline:2px solid #fff}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:#222}
.card .title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#000 85%,transparent);padding:7px 6px;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .live{position:absolute;top:5px;left:5px;background:var(--red);font-size:8px;padding:2px 5px;border-radius:2px;font-weight:900;letter-spacing:.5px}
#playerModal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#playerModal.active{display:flex}
.player-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#0a0a0a;border-bottom:1px solid #222}
.player-top-left{display:flex;align-items:center;gap:12px}
#nowPlaying{font-weight:700;font-size:14px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playerStatus{font-size:11px;color:#999}
#videoWrap{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;max-height:calc(100vh - 52px);background:#000}
#spinner{position:absolute;width:40px;height:40px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#statusBar{padding:12px 4%;background:#191919;color:#888;font-size:12px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #222}
.dot{width:8px;height:8px;background:#0f0;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.empty{padding:40px 4%;text-align:center;color:#666}
</style>
</head>
<body>
<header id="header">
<div class="logo">FLIX</div>
<div class="tabs">
<button class="tab active" data-filter="all" onclick="setFilter('all')">TODOS <span id="c-all">0</span></button>
<button class="tab" data-filter="tv" onclick="setFilter('tv')">📺 TV <span id="c-tv">0</span></button>
<button class="tab" data-filter="filme" onclick="setFilter('filme')">🎬 FILMES <span id="c-filme">0</span></button>
<button class="tab" data-filter="serie" onclick="setFilter('serie')">🍿 SÉRIES <span id="c-serie">0</span></button>
</div>
<div class="search"><input id="searchInput" placeholder="Buscar..." oninput="applyFilters()"></div>
</header>
<div class="hero" id="hero" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600')">
<div class="hero-content">
<span class="badge" id="heroBadge">AO VIVO</span>
<h1 id="heroTitle">Carregando sua lista...</h1>
<p id="heroDesc">Organizando por categorias</p>
<button class="btn btn-play" onclick="playFirst()">▶ Assistir</button>
</div>
</div>
<div id="statusBar"><span class="dot"></span><span id="status">Conectando...</span><span id="status2" style="margin-left:auto;color:#555"></span></div>
<div class="rows" id="rows"></div>
<div id="playerModal">
<div class="player-top"><div class="player-top-left"><button class="btn" style="background:#222;color:#fff;padding:6px 12px" onclick="closePlayer()">◀ Voltar</button><div><div id="nowPlaying">-</div><div id="playerStatus">Carregando...</div></div></div><button class="btn" style="background:var(--red);color:#fff;padding:6px 14px" onclick="closePlayer()">✕</button></div>
<div id="videoWrap"><div id="spinner"></div><video id="video" controls playsinline preload="auto"></video></div>
</div>
<script>
const URL_DA_SUA_LISTA = "http://e.guecdn.online/p/998641729/424695392/m3u";
const PROXIES = ["https://cors.luckydesigner.workers.dev/?", "https://corsproxy.io/?", "https://api.allorigins.win/raw?url="];
let allChannels=[]; let filtered=[]; let currentFilter='all'; let hls=null;
function classifyChannel(name,group){
 const s=(name+" "+group).toLowerCase();
 if(s.includes("filme")||s.includes("movie")||s.includes("cinema")||s.includes("vod")&&!s.includes("serie")) return "filme";
 if(s.includes("série")||s.includes("serie")||s.includes("temporada")||s.includes("episod")||s.includes("novela")||s.includes("anime")) return "serie";
 return "tv";
}
function parseM3U(text){
 const lines=text.split("\n");const chans=[];
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(line.startsWith("#EXTINF")){
   const nameMatch=line.match(/,(.*)$/);const name=nameMatch?nameMatch[1].trim():"Canal";
   const groupMatch=line.match(/group-title="([^"]+)"/);const group=groupMatch?groupMatch[1]:"Geral";
   const logoMatch=line.match(/tvg-logo="([^"]+)"/);const logo=logoMatch?logoMatch[1]:"";
   const url=(lines[i+1]||"").trim();
   if(url&&url.startsWith("http")){const type=classifyChannel(name,group);chans.push({name,group,logo:logo||`https://picsum.photos/seed/${encodeURIComponent(name)}/300/450`,url,type});}
  }
 }
 return chans;
}
function setFilter(f){currentFilter=f;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.filter===f));applyFilters();}
function applyFilters(){
 const q=document.getElementById("searchInput").value.toLowerCase().trim();
 filtered=allChannels.filter(c=>{const matchFilter=currentFilter==='all'||c.type===currentFilter;const matchSearch=!q||c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q);return matchFilter&&matchSearch;});
 renderByCategory(filtered);
}
function renderByCategory(channels){
 const rowsDiv=document.getElementById("rows");rowsDiv.innerHTML="";
 if(!channels.length){rowsDiv.innerHTML='<div class="empty">Nenhum conteúdo encontrado 🔍</div>';return;}
 const groups={};channels.forEach(c=>{if(!groups[c.group])groups[c.group]=[];groups[c.group].push(c);});
 Object.keys(groups).sort().forEach(groupName=>{
  const items=groups[groupName];const sampleType=items[0]?.type||'tv';const isPoster=sampleType!=='tv';
  const row=document.createElement("div");row.className="row";
  row.innerHTML=`<div class="row-head"><h2>${groupName}</h2><span class="count">${items.length} títulos</span></div><div class="carousel"></div>`;
  rowsDiv.appendChild(row);const carousel=row.querySelector(".carousel");
  items.forEach(ch=>{
   const card=document.createElement("div");card.className=`card ${ch.type==='tv'?'':ch.type}`;
   const liveBadge=ch.type==='tv'?'<div class="live">AO VIVO</div>':'';card.innerHTML=`${liveBadge}<img loading="lazy" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/300x450/222/666?text=${encodeURIComponent(ch.name.slice(0,15))}'"><div class="title">${ch.name}</div>`;
   card.onclick=()=>{play(ch.url,ch.name,ch.logo);updateHero(ch);};carousel.appendChild(card);
  });
 });
}
function updateHero(ch){document.getElementById("heroTitle").innerText=ch.name;document.getElementById("heroDesc").innerText=ch.group+" • "+(ch.type==='tv'?'AO VIVO':ch.type==='filme'?'FILME':'SÉRIE');document.getElementById("heroBadge").innerText=ch.type==='tv'?'AO VIVO':ch.type.toUpperCase();if(ch.logo)document.getElementById("hero").style.backgroundImage=`url(${ch.logo})`;}
async function loadAuto(){
 const statusEl=document.getElementById("status");
 try{
  statusEl.innerText="Baixando lista...";let text=null;
  for(let p of PROXIES){try{const urlFetch=p.includes("allorigins")||p.includes("corsproxy.io")?p+encodeURIComponent(URL_DA_SUA_LISTA):p+URL_DA_SUA_LISTA;const res=await fetch(urlFetch);if(res.ok){text=await res.text();if(text.includes("#EXTINF"))break;}}catch(e){continue;}}
  if(!text||!text.includes("#EXTINF")){const r=await fetch("./playlist.m3u?v="+Date.now());if(r.ok)text=await r.text();}
  if(!text)throw new Error("Lista vazia");const chans=parseM3U(text);allChannels=chans;
  document.getElementById("c-all").innerText=chans.length;document.getElementById("c-tv").innerText=chans.filter(c=>c.type==='tv').length;document.getElementById("c-filme").innerText=chans.filter(c=>c.type==='filme').length;document.getElementById("c-serie").innerText=chans.filter(c=>c.type==='serie').length;
  statusEl.innerText=chans.length+" conteúdos organizados";
