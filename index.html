<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIX - IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--red:#e50914;--bg:#141414;--card:#232323}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:#fff}
header{position:fixed;top:0;width:100%;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:linear-gradient(180deg,#000 80%,transparent)}
header.scrolled{background:#141414}
.logo{color:var(--red);font-weight:900;font-size:30px}
.search input{background:rgba(0,0,0,.7);border:1px solid #555;color:#fff;padding:8px 14px;border-radius:4px;width:240px}
.hero{height:72vh;position:relative;display:flex;align-items:end;padding:0 4% 60px;background-size:cover}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(0deg,var(--bg),transparent)}
.hero-content{position:relative;z-index:2;max-width:650px}
.hero h1{font-size:44px;margin-bottom:10px}
.btn{padding:10px 24px;border:none;border-radius:4px;font-weight:700;cursor:pointer}
.btn-play{background:#fff;color:#000}
.rows{margin-top:-50px;position:relative;z-index:3}
.row{padding:14px 4%}.row h2{margin-bottom:12px;font-size:20px}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:165px;max-width:165px;height:92px;background:var(--card);border-radius:4px;overflow:hidden;cursor:pointer;transition:.25s;flex-shrink:0;position:relative}
.card.movie{min-width:170px;max-width:170px;height:255px}
.card:hover{transform:scale(1.08);z-index:5}
.card img{width:100%;height:100%;object-fit:cover}
.card .title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#000 70%,transparent);padding:8px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playerModal{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#playerModal.active{display:flex}
.player-top{display:flex;justify-content:space-between;padding:14px 20px;background:#111;align-items:center}
#video{width:100%;height:calc(100vh - 56px);background:#000}
#status{padding:20px 4%;color:#888;font-size:14px}
</style>
</head>
<body>
<header id="header"><div class="logo">FLIX</div><div class="search"><input id="searchInput" placeholder="Buscar..." onkeyup="filterAll()"></div></header>
<div class="hero" id="hero" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600')">
<div class="hero-content"><h1 id="heroTitle">Carregando...</h1><p id="heroDesc">Conectando</p><button class="btn btn-play" onclick="playFirst()">▶ Assistir</button></div></div>
<div id="status">Carregando canais...</div>
<div class="rows" id="rows"></div>
<div id="playerModal"><div class="player-top"><span id="nowPlaying">Reproduzindo</span><button class="btn" style="background:#333;color:#fff" onclick="closePlayer()">X</button></div><video id="video" controls autoplay></video></div>
<script>
const URL_DA_SUA_LISTA = "http://e.guecdn.online/p/998641729/424695392/m3u";
let allChannels=[]; let hls;
function parseM3U(text){
 const lines=text.split("\n"); const chans=[];
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(line.startsWith("#EXTINF")){
   const nameMatch=line.match(/,(.*)$/); const name=nameMatch?nameMatch[1].trim():"Canal";
   const groupMatch=line.match(/group-title="([^"]+)"/); const group=groupMatch?groupMatch[1]:"Geral";
   const logoMatch=line.match(/tvg-logo="([^"]+)"/); const logo=logoMatch?logoMatch[1]:"https://picsum.photos/300/400?random=1";
   const url=(lines[i+1]||"").trim();
   if(url && url.startsWith("http")){ chans.push({name,group,logo,url}); }
  }
 }
 return chans;
}
function renderByCategory(channels){
 allChannels=channels;
 document.getElementById("status").innerText = channels.length + " canais - " + new Date().toLocaleTimeString();
 const rowsDiv=document.getElementById("rows"); rowsDiv.innerHTML="";
 const groups={}; channels.forEach(c=>{ if(!groups[c.group]) groups[c.group]=[]; groups[c.group].push(c); });
 if(channels.length){
  document.getElementById("heroTitle").innerText=channels[0].name;
  document.getElementById("heroDesc").innerText=channels[0].group;
  document.getElementById("hero").style.backgroundImage=`url(${channels[0].logo})`;
 }
 Object.keys(groups).sort().forEach(groupName=>{
  const row=document.createElement("div"); row.className="row";
  const isMovie=groupName.toLowerCase().includes("filme")||groupName.toLowerCase().includes("vod");
  row.innerHTML=`<h2>${groupName} (${groups[groupName].length})</h2><div class="carousel"></div>`;
  rowsDiv.appendChild(row);
  const carousel=row.querySelector(".carousel");
  groups[groupName].forEach(ch=>{
   const card=document.createElement("div"); card.className=`card ${isMovie?"movie":""}`;
   card.innerHTML=`<img src="${ch.logo}" onerror="this.src='https://picsum.photos/300/400'"><div class="title">${ch.name}</div>`;
   card.onclick=()=>play(ch.url,ch.name,ch.logo); carousel.appendChild(card);
  });
 });
}
async function loadAuto(){
 const statusEl=document.getElementById("status");
 try{
  statusEl.innerText="Baixando lista...";
  const proxies = ["https://corsproxy.io/?", "https://api.allorigins.win/raw?url=", ""];
  let text=null;
  for(let p of proxies){
    try{
      const urlFetch = p ? p + encodeURIComponent(URL_DA_SUA_LISTA) : URL_DA_SUA_LISTA;
      const res = await fetch(urlFetch);
      if(res.ok){ text = await res.text(); if(text.includes("#EXTINF")) break; }
    }catch(e){ continue; }
  }
  if(!text || !text.includes("#EXTINF")){
    const resLocal = await fetch("./playlist.m3u?v="+Date.now());
    if(resLocal.ok) text = await resLocal.text();
  }
  if(!text) throw new Error("Lista vazia");
  const chans=parseM3U(text);
  if(!chans.length) throw new Error("Nenhum canal");
  renderByCategory(chans);
 }catch(err){
  statusEl.innerText="Erro: "+err.message;
 }
}
function play(url,title,logo){
 document.getElementById("nowPlaying").innerText=title;
 const modal=document.getElementById("playerModal"); const video=document.getElementById("video");
 modal.classList.add("active");
 if(hls){hls.destroy(); hls=null;}
 if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
 else if(video.canPlayType("application/vnd.apple.mpegurl")){ video.src=url; video.play(); }
 else { video.src=url; video.play(); }
}
function closePlayer(){document.getElementById("playerModal").classList.remove("active"); document.getElementById("video").pause(); if(hls){hls.destroy();}}
function playFirst(){ if(allChannels.length) play(allChannels[0].url, allChannels[0].name, allChannels[0].logo); }
function filterAll(){ const q=document.getElementById("searchInput").value.toLowerCase(); document.querySelectorAll(".card").forEach(c=>{ c.style.display=c.innerText.toLowerCase().includes(q)?"":"none"; }); }
window.addEventListener("scroll",()=>{ document.getElementById("header").classList.toggle("scrolled", window.scrollY>10); });
loadAuto();
</script>
</body>
</html>
