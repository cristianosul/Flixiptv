<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIX - IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--red:#e50914;--bg:#141414;--card:#232323}
*{margin:0;padding:0;box-sizing:border-box;font-family:Netflix Sans,Helvetica,Arial}
body{background:var(--bg);color:#fff;overflow-x:hidden}
header{position:fixed;top:0;width:100%;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:linear-gradient(180deg,#000 10%,transparent);transition:.4s}
header.scrolled{background:#141414}
.logo{color:var(--red);font-weight:900;font-size:32px;letter-spacing:1px}
.search input{background:rgba(0,0,0,.7);border:1px solid #555;color:#fff;padding:8px 14px;border-radius:4px;width:260px}
.hero{height:75vh;position:relative;display:flex;align-items:end;padding:0 4% 60px;background-size:cover;background-position:center top}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.8) 0,transparent 85%)}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:150px;background:linear-gradient(0deg,var(--bg),transparent)}
.hero-content{position:relative;z-index:2;max-width:650px}
.hero h1{font-size:48px;margin-bottom:12px;text-shadow:2px 2px 4px #000}
.hero p{color:#ddd;margin-bottom:18px;font-size:16px;line-height:1.4}
.btn{padding:10px 26px;border:none;border-radius:4px;font-weight:700;cursor:pointer;font-size:16px}
.btn-play{background:#fff;color:#000}.btn-play:hover{background:rgba(255,255,255,.8)}
.btn-list{background:rgba(109,109,110,.7);color:#fff;margin-left:8px}
.rows{margin-top:-60px;position:relative;z-index:3}
.row{padding:12px 4%}.row h2{margin-bottom:12px;font-size:22px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:10px 0}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:165px;max-width:165px;height:92px;background:var(--card);border-radius:4px;overflow:hidden;cursor:pointer;transition:.3s;flex-shrink:0;position:relative}
.card.movie{min-width:180px;max-width:180px;height:270px}
.card:hover{transform:scale(1.08);z-index:5;box-shadow:0 10px 30px #000}
.card img{width:100%;height:100%;object-fit:cover}
.card .title{position:absolute;bottom:0;background:linear-gradient(0deg,#000 60%,transparent);width:100%;padding:8px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playerModal{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#playerModal.active{display:flex}
.player-top{display:flex;justify-content:space-between;padding:14px 20px;background:#111;align-items:center}
#video{width:100%;height:calc(100vh - 56px);background:#000}
.badge{position:absolute;top:6px;left:6px;background:var(--red);font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700}
</style>
</head>
<body>
<header id="header"><div class="logo">FLIX</div><div class="search"><input id="searchInput" placeholder="Títulos, gente e gêneros" onkeyup="filterAll()"></div></header>

<div class="hero" id="hero" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600')">
<div class="hero-content">
<h1 id="heroTitle">Carregando sua lista...</h1>
<p id="heroDesc">Este player lê automaticamente o arquivo playlist.m3u. Use apenas conteúdo autorizado.</p>
<button class="btn btn-play" onclick="playFirst()">▶ Assistir</button>
<button class="btn btn-list" onclick="document.getElementById('rows').scrollIntoView()">＋ Minha Lista</button>
</div>
</div>

<div class="rows" id="rows"></div>

<div id="playerModal">
<div class="player-top"><span id="nowPlaying">Reproduzindo</span><button class="btn btn-list" onclick="closePlayer()">✕ Fechar</button></div>
<video id="video" controls autoplay></video>
</div>

<script>
let allChannels = [];
let hls;
const heroImages = ['https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600','https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1600','https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=1600'];

function parseM3U(text){
 const lines=text.split('\n');
 const chans=[];
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(line.startsWith('#EXTINF')){
   const nameMatch=line.match(/,(.*)$/);
   const name=nameMatch?nameMatch[1].trim():'Canal';
   const groupMatch=line.match(/group-title="([^"]+)"/);
   const group=groupMatch?groupMatch[1]:'Geral';
   const logoMatch=line.match(/tvg-logo="([^"]+)"/);
   const logo=logoMatch?logoMatch[1]:`https://picsum.photos/seed/${encodeURIComponent(name)}/300/400`;
   const url=lines[i+1]?.trim();
   if(url && url.startsWith('http')) chans.push({name,group,logo,url});
  }
 }
 return chans;
}

function renderByCategory(channels){
 allChannels=channels;
 const rowsDiv=document.getElementById('rows');
 rowsDiv.innerHTML='';
 const groups={};
 channels.forEach(c=>{if(!groups[c.group]) groups[c.group]=[]; groups[c.group].push(c);});
 
 if(channels.length){
  document.getElementById('heroTitle').innerText=channels[0].name;
  document.getElementById('hero').style.backgroundImage=`url(${channels[0].logo})`;
 }
 
 Object.keys(groups).forEach(groupName=>{
  const row=document.createElement('div'); row.className='row';
  const isMovie=groupName.toLowerCase().includes('filme')||groupName.toLowerCase().includes('série')||groupName.toLowerCase().includes('serie');
  row.innerHTML=`<h2>${groupName}</h2><div class="carousel" id="cat-${groupName}"></div>`;
  rowsDiv.appendChild(row);
  const carousel=row.querySelector('.carousel');
  groups[groupName].forEach(ch=>{
   const card=document.createElement('div'); card.className=`card ${isMovie?'movie':''}`;
   card.innerHTML=`<img src="${ch.logo}" onerror="this.src='https://picsum.photos/300/400?random=1'"><div class="title">${ch.name}</div>${groupName.toLowerCase().includes('ao vivo')?'<div class=badge>AO VIVO</div>':''}`;
   card.onclick=()=>play(ch.url,ch.name,ch.logo);
   carousel.appendChild(card);
  });
 });
}

async function loadAuto(){
 try{
  const res=await fetch('./playlist.m3u?v='+Date.now());
  if(!res.ok) throw new Error('no m3u');
  const text=await res.text();
  const chans=parseM3U(text);
  if(chans.length) renderByCategory(chans); else throw new Error('empty');
 }catch(e){
  console.log('Sem playlist.m3u, usando demo');
  const demo=[
   {name:"Big Buck Bunny - Demo",group:"Filmes",logo:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
   {name:"Esporte Demo",group:"Esportes",logo:"https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=400",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
   {name:"Infantil Demo",group:"Infantil",logo:"https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=400",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  ];
  renderByCategory(demo);
 }
}

function play(url,title,logo){
 document.getElementById('nowPlaying').innerText=title;
 document.getElementById('hero').style.backgroundImage=`url(${logo})`;
 const modal=document.getElementById('playerModal');
 const video=document.getElementById('video');
 modal.classList.add('active');
 if(hls){hls.destroy();}
 if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());}
 else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play();}
}
function closePlayer(){document.getElementById('playerModal').classList.remove('active');document.getElementById('video').pause();if(hls)hls.destroy();}
function playFirst(){if(allChannels.length) play(allChannels[0].url,allChannels[0].name,allChannels[0].logo);}
function filterAll(){const q=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'':'none'})}
window.addEventListener('scroll',()=>{document.getElementById('header').classList.toggle('scrolled',window.scrollY>10)});
loadAuto();
</script>
</body>
</html>
