<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIX PRO - FINAL 67MB CORRIGIDO</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
:root{--red:#e50914;--bg:#0f0f0f;--card:#1f1f1f}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:#fff}
header{position:fixed;top:0;width:100%;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 3%;background:#000}
.logo{color:var(--red);font-weight:900;font-size:24px}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:20px;background:#222;color:#aaa;border:none;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.tab span{font-size:10px;opacity:.7;margin-left:3px}
.search input{background:#111;border:1px solid #333;color:#fff;padding:7px 12px;border-radius:4px;width:140px}
.hero{height:50vh;min-height:320px;display:flex;align-items:flex-end;padding:0 4% 28px;background-size:cover;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg,#000 85%,transparent)}
.hero-content{position:relative;z-index:2}
.hero h1{font-size:28px}
.btn-play{background:#fff;color:#000;border:none;padding:9px 18px;border-radius:4px;font-weight:800;cursor:pointer}
.rows{padding:10px 3%}
.carousel{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:130px;max-width:130px;height:74px;background:var(--card);border-radius:4px;overflow:hidden;position:relative;flex-shrink:0;cursor:pointer}
.card.movie{min-width:108px;max-width:108px;height:162px}
.card:hover{transform:scale(1.05);outline:2px solid #fff}
.card img{width:100%;height:100%;object-fit:cover;background:#222}
.card .title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#000 85%,transparent);padding:5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .live{position:absolute;top:3px;left:3px;background:var(--red);font-size:7px;padding:2px 4px;border-radius:2px;font-weight:900}
#playerModal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#playerModal.active{display:flex}
.player-top{display:flex;justify-content:space-between;padding:10px;background:#0a0a0a;align-items:center}
#videoWrap{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;background:#000}
#spinner{position:absolute;width:36px;height:36px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#statusBar{padding:10px 3%;background:#191919;color:#aaa;font-size:12px}
</style>
</head>
<body>
<header>
<div class="logo">FLIX</div>
<div class="tabs">
<button class="tab active" data-filter="all" onclick="setFilter('all')">TODOS <span id="c-all">0</span></button>
<button class="tab" data-filter="tv" onclick="setFilter('tv')">📺 TV <span id="c-tv">0</span></button>
<button class="tab" data-filter="filme" onclick="setFilter('filme')">🎬 FILMES <span id="c-filme">0</span></button>
<button class="tab" data-filter="serie" onclick="setFilter('serie')">🍿 SÉRIES <span id="c-serie">0</span></button>
</div>
<div class="search"><input id="searchInput" placeholder="Buscar..." oninput="applyFilters()"></div>
</header>
<div class="hero" id="hero" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600')"><div class="hero-content"><h1 id="heroTitle">Carregando 67MB...</h1><p id="heroDesc" style="color:#bbb;font-size:12px;margin:6px 0">Buzzheavier yspsvt4adud3 - FINAL</p><button class="btn-play" onclick="playFirst()">▶ Assistir</button></div></div>
<div id="statusBar"><span id="status">Iniciando download...</span></div>
<div class="rows" id="rows"></div>
<div id="playerModal"><div class="player-top"><button onclick="closePlayer()" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:4px">◀ Voltar</button><span id="nowPlaying" style="font-size:12px;font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button onclick="closePlayer()" style="background:var(--red);color:#fff;border:none;padding:6px 12px;border-radius:4px">✕</button></div><div id="videoWrap"><div id="spinner"></div><video id="video" controls autoplay playsinline preload="auto"></video></div></div>

<script>
const BUZZ_ID="yspsvt4adud3";
let allChannels=[],filtered=[],currentFilter='all',hls=null;
function classify(n,g){const s=(n+" "+g).toLowerCase();if(s.includes("filme")||s.includes("movie")||s.includes("cinema")||(s.includes("vod")&&!s.includes("serie")))return"filme";if(s.includes("serie")||s.includes("série")||s.includes("temporada")||s.includes("epis")||s.includes("novela")||s.includes("anime")||s.includes("dorama"))return"serie";return"tv";}
function parseM3U(text){const lines=text.split("\n");const chans=[];for(let i=0;i<lines.length;i++){const l=lines[i].trim();if(l.startsWith("#EXTINF")){const n=(l.match(/,(.*)$/)||[,"Canal"])[1].trim();const g=(l.match(/group-title="([^"]+)"/)||[,"Geral"])[1];const lo=(l.match(/tvg-logo="([^"]+)"/)||["",""])[1];const u=(lines[i+1]||"").trim();if(u.startsWith("http"))chans.push({name:n,group:g,logo:lo,url:u,type:classify(n,g)});}}return chans;}
function setFilter(f){currentFilter=f;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.filter===f));applyFilters();}
function applyFilters(){const q=document.getElementById("searchInput").value.toLowerCase().trim();filtered=allChannels.filter(c=>{const mf=currentFilter==='all'||c.type===currentFilter;const ms=!q||c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q);return mf&&ms;});render(filtered);}
function render(channels){const rowsDiv=document.getElementById("rows");rowsDiv.innerHTML="";if(!channels.length){rowsDiv.innerHTML='<div style="padding:40px;text-align:center;color:#666">Nenhum conteúdo</div>';return;}const groups={};channels.forEach(c=>{if(!groups[c.group])groups[c.group]=[];groups[c.group].push(c);});Object.keys(groups).sort().forEach(g=>{const items=groups[g];const row=document.createElement("div");row.className="row";row.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><h2 style="font-size:15px">${g}</h2><span style="color:#666;font-size:11px">${items.length}</span></div><div class="carousel"></div>`;rowsDiv.appendChild(row);const car=row.querySelector(".carousel");items.forEach(ch=>{const card=document.createElement("div");card.className=`card ${ch.type==='tv'?'':'movie'}`;const badge=ch.type==='tv'?'<div class="live">AO VIVO</div>':'';card.innerHTML=`${badge}<img loading="lazy" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/300x450/222/666?text=FLIX'"><div class="title">${ch.name}</div>`;card.onclick=()=>{play(ch.url,ch.name);document.getElementById("heroTitle").innerText=ch.name;document.getElementById("heroDesc").innerText=ch.group;if(ch.logo)document.getElementById("hero").style.backgroundImage=`url(${ch.logo})`;};car.appendChild(card);});});}
function updateCounts(){document.getElementById("c-all").innerText=allChannels.length;document.getElementById("c-tv").innerText=allChannels.filter(c=>c.type==='tv').length;document.getElementById("c-filme").innerText=allChannels.filter(c=>c.type==='filme').length;document.getElementById("c-serie").innerText=allChannels.filter(c=>c.type==='serie').length;}

async function loadAll(){
 const status=document.getElementById("status");
 const proxies=[
  `https://corsproxy.io/?https://buzzheavier.com/${BUZZ_ID}/download`,
  `https://api.allorigins.win/raw?url=https://buzzheavier.com/${BUZZ_ID}/download`,
  `https://cors-anywhere.herokuapp.com/https://buzzheavier.com/${BUZZ_ID}/download`
 ];
 let text=null;
 for(let proxy of proxies){
  try{
   status.innerText=`Baixando 67MB via proxy... aguarde 10s`;
   const r=await fetch(proxy);
   if(r.ok){
    text=await r.text();
    if(text && text.includes("#EXTM3U") && text.length > 100000){
     break;
    }
   }
  }catch(e){console.log("Proxy falhou",proxy);}
 }
 if(!text||!text.includes("#EXTM3U")){
  status.innerText=`ERRO: Buzzheavier bloqueou. SOLUÇÃO RÁPIDA: No Buzzheavier clique em "Copy download link" e cole aqui, ou suba no https://catbox.moe`;
  return;
 }
 const chans=parseM3U(text);
 allChannels=chans; filtered=chans;
 status.innerText=`${chans.length} conteúdos - TV:${chans.filter(c=>c.type==='tv').length} FILMES:${chans.filter(c=>c.type==='filme').length} SÉRIES:${chans.filter(c=>c.type==='serie').length} - 67MB OK!`;
 if(chans.length){document.getElementById("heroTitle").innerText=chans[0].name;document.getElementById("heroDesc").innerText=chans[0].group;if(chans[0].logo)document.getElementById("hero").style.backgroundImage=`url(${chans[0].logo})`;}
 updateCounts(); render(chans);
}

function play(url,title){
 const modal=document.getElementById("playerModal");const video=document.getElementById("video");const spinner=document.getElementById("spinner");
 document.getElementById("nowPlaying").innerText=title;spinner.style.display="block";modal.classList.add("active");
 if(hls){try{hls.destroy()}catch(e){}hls=null;}video.pause();video.removeAttribute("src");video.load();
 const isMp4=url.toLowerCase().includes(".mp4")||url.toLowerCase().includes(".mkv")||url.toLowerCase().includes(".avi")||url.toLowerCase().includes(".mpd");
 let finalUrl=url; if(isMp4&&url.startsWith("http://")) finalUrl=url.replace("http://","https://");
 if(isMp4){
  video.src=finalUrl;video.play().then(()=>{spinner.style.display="none";}).catch(()=>{
   spinner.style.display="none";
   // tenta http original
   video.src=url;video.play().catch(()=>{alert("Link offline ou bloqueado: "+title);closePlayer();});
  });
 }else{
  const cfg={enableWorker:true,lowLatencyMode:true,maxBufferLength:12};
  if(Hls.isSupported()){
   hls=new Hls(cfg);hls.loadSource(finalUrl);hls.attachMedia(video);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{spinner.style.display="none";video.play();});
   hls.on(Hls.Events.ERROR,(ev,d)=>{if(d.fatal){console.log(d);spinner.style.display="none";video.src=finalUrl;video.play();}});
  }else{video.src=finalUrl;video.play();spinner.style.display="none";}
 }
}
function closePlayer(){document.getElementById("playerModal").classList.remove("active");const v=document.getElementById("video");v.pause();v.removeAttribute("src");v.load();if(hls){try{hls.destroy()}catch(e){}hls=null;}document.getElementById("spinner").style.display="none";}
function playFirst(){if(filtered.length)play(filtered[0].url,filtered[0].name);}
loadAll();
</script>
</body>
</html>
