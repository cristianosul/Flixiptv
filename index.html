<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIX PRO</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
:root{--red:#e50914;--bg:#0f0f0f;--card:#1f1f1f}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:#fff}
header{position:fixed;top:0;width:100%;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 3%;background:#000}
.logo{color:var(--red);font-weight:900;font-size:24px}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:20px;background:#222;color:#aaa;border:none;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.tab span{opacity:.7;font-size:10px;margin-left:3px}
.search input{background:#111;border:1px solid #333;color:#fff;padding:7px 12px;border-radius:4px;width:150px}
.hero{height:52vh;min-height:340px;position:relative;display:flex;align-items:flex-end;padding:0 4% 30px;background-size:cover;background-position:center top}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.9),transparent 70%)}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(0deg,var(--bg),transparent)}
.hero-content{position:relative;z-index:2;max-width:600px}
.badge{background:var(--red);padding:3px 7px;border-radius:3px;font-size:10px;font-weight:900;margin-bottom:8px;display:inline-block}
.hero h1{font-size:32px;margin-bottom:6px}
.btn{padding:9px 18px;border:none;border-radius:4px;font-weight:800;cursor:pointer}
.btn-play{background:#fff;color:#000}
.rows{position:relative;z-index:2;padding:10px 3%}
.row{margin-bottom:14px}
.row-head{display:flex;justify-content:space-between;margin-bottom:8px}
.row h2{font-size:15px}
.carousel{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:135px;max-width:135px;height:76px;background:var(--card);border-radius:4px;overflow:hidden;position:relative;flex-shrink:0;cursor:pointer;transition:.15s}
.card.movie{min-width:110px;max-width:110px;height:165px}
.card:hover{transform:scale(1.05);outline:2px solid #fff}
.card img{width:100%;height:100%;object-fit:cover;background:#222}
.card .title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#000 85%,transparent);padding:5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .live{position:absolute;top:3px;left:3px;background:var(--red);font-size:7px;padding:2px 4px;border-radius:2px;font-weight:900}
#playerModal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#playerModal.active{display:flex}
.player-top{display:flex;justify-content:space-between;padding:10px;background:#0a0a0a;border-bottom:1px solid #222;align-items:center}
#videoWrap{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;background:#000}
#spinner{position:absolute;width:36px;height:36px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#statusBar{padding:10px 3%;background:#191919;color:#aaa;font-size:12px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;background:#0f0;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<header>
<div class="logo">FLIX</div>
<div class="tabs">
<button class="tab active" data-filter="all" onclick="setFilter('all')">TODOS <span id="c-all">0</span></button>
<button class="tab" data-filter="tv" onclick="setFilter('tv')">📺 TV <span id="c-tv">0</span></button>
<button class="tab" data-filter="filme" onclick="setFilter('filme')">🎬 FILMES <span id="c-filme">0</span></button>
<button class="tab" data-filter="serie" onclick="setFilter('serie')">🍿 SÉRIES <span id="c-serie">0</span></button>
</div>
<div class="search"><input id="searchInput" placeholder="Buscar..." oninput="applyFilters()"></div>
</header>

<div class="hero" id="hero" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600')">
<div class="hero-content"><span class="badge" id="heroBadge">AO VIVO</span><h1 id="heroTitle">Carregando...</h1><p id="heroDesc" style="color:#bbb;font-size:12px;margin:6px 0">Direto da pasta playlist.m3u</p><button class="btn btn-play" onclick="playFirst()">▶ Assistir</button></div>
</div>

<div id="statusBar"><span class="dot"></span><span id="status">Lendo playlist.m3u da pasta...</span><span id="status2" style="margin-left:auto"></span></div>
<div class="rows" id="rows"></div>

<div id="playerModal">
<div class="player-top"><button onclick="closePlayer()" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:4px">◀ Voltar</button><span id="nowPlaying" style="font-size:12px;font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button onclick="closePlayer()" style="background:var(--red);color:#fff;border:none;padding:6px 12px;border-radius:4px">✕</button></div>
<div id="videoWrap"><div id="spinner" style="display:none"></div><video id="video" controls autoplay playsinline preload="auto"></video></div>
</div>

<script>
let allChannels=[], filtered=[], currentFilter='all', hls=null;

function classify(name,group){
 const s=(name+" "+group).toLowerCase();
 if(s.includes("filme")||s.includes("movie")||s.includes("cinema")||(s.includes("vod")&&!s.includes("serie"))) return "filme";
 if(s.includes("serie")||s.includes("série")||s.includes("temporada")||s.includes("epis")||s.includes("novela")||s.includes("anime")||s.includes("dorama")) return "serie";
 return "tv";
}
function parseM3U(text){
 const lines=text.split("\n"); const chans=[];
 for(let i=0;i<lines.length;i++){
  const l=lines[i].trim();
  if(l.startsWith("#EXTINF")){
   const n=(l.match(/,(.*)$/)||[,"Canal"])[1].trim();
   const g=(l.match(/group-title="([^"]+)"/)||[,"Geral"])[1];
   const lo=(l.match(/tvg-logo="([^"]+)"/)||["",""])[1];
   const u=(lines[i+1]||"").trim();
   if(u.startsWith("http")) chans.push({name:n,group:g,logo:lo||`https://picsum.photos/seed/${encodeURIComponent(n)}/300/450`,url:u,type:classify(n,g)});
  }
 }
 return chans;
}
function setFilter(f){currentFilter=f;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.filter===f));applyFilters();}
function applyFilters(){
 const q=document.getElementById("searchInput").value.toLowerCase().trim();
 filtered=allChannels.filter(c=>{
  const mf=currentFilter==='all'||c.type===currentFilter;
  const ms=!q||c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q);
  return mf&&ms;
 });
 render(filtered);
}
function render(channels){
 const rowsDiv=document.getElementById("rows");rowsDiv.innerHTML="";
 if(!channels.length){rowsDiv.innerHTML='<div style="padding:40px;text-align:center;color:#666">Nenhum conteúdo</div>';return;}
 const groups={};channels.forEach(c=>{if(!groups[c.group])groups[c.group]=[];groups[c.group].push(c);});
 Object.keys(groups).sort().forEach(g=>{
  const items=groups[g];
  const row=document.createElement("div");row.className="row";
  row.innerHTML=`<div class="row-head"><h2>${g}</h2><span style="color:#666;font-size:11px">${items.length}</span></div><div class="carousel"></div>`;
  rowsDiv.appendChild(row);
  const car=row.querySelector(".carousel");
  items.forEach(ch=>{
   const card=document.createElement("div");card.className=`card ${ch.type==='tv'?'':'movie'}`;
   const badge=ch.type==='tv'?'<div class="live">AO VIVO</div>':'';
   card.innerHTML=`${badge}<img loading="lazy" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/300x450/222/666?text=FLIX'"><div class="title">${ch.name}</div>`;
   card.onclick=()=>{
     play(ch.url,ch.name);
     document.getElementById("heroTitle").innerText=ch.name;
     document.getElementById("heroDesc").innerText=ch.group;
     document.getElementById("heroBadge").innerText=ch.type.toUpperCase();
     if(ch.logo) document.getElementById("hero").style.backgroundImage=`url(${ch.logo})`;
   };
   car.appendChild(card);
  });
 });
}
function updateCounts(){
 document.getElementById("c-all").innerText=allChannels.length;
 document.getElementById("c-tv").innerText=allChannels.filter(c=>c.type==='tv').length;
 document.getElementById("c-filme").innerText=allChannels.filter(c=>c.type==='filme').length;
 document.getElementById("c-serie").innerText=allChannels.filter(c=>c.type==='serie').length;
}

// CARREGA DIRETO DA PASTA - SEM PROXY
async function loadAuto(){
 const status=document.getElementById("status");
 try{
  status.innerText="Lendo playlist.m3u...";
  const r=await fetch("./playlist.m3u?v="+Date.now());
  if(!r.ok) throw new Error("playlist.m3u não encontrada na pasta");
  const text=await r.text();
  const chans=parseM3U(text);
  if(!chans.length) throw new Error("playlist.m3u vazia");
  allChannels=chans;
  filtered=chans;
  status.innerText=chans.length+" conteúdos carregados da pasta";
  document.getElementById("status2").innerText=new Date().toLocaleTimeString();
  document.getElementById("heroTitle").innerText=chans[0].name;
  document.getElementById("heroDesc").innerText=chans[0].group;
  if(chans[0].logo) document.getElementById("hero").style.backgroundImage=`url(${chans[0].logo})`;
  updateCounts();
  render(chans);
 }catch(err){
  status.innerText="Erro: "+err.message+" - Verifique se playlist.m3u está no GitHub";
 }
}

// PLAYER CORRIGIDO PARA FILME
function play(url,title){
 const modal=document.getElementById("playerModal");
 const video=document.getElementById("video");
 const spinner=document.getElementById("spinner");
 document.getElementById("nowPlaying").innerText=title;
 spinner.style.display="block";
 modal.classList.add("active");

 if(hls){try{hls.destroy()}catch(e){}hls=null;}
 video.pause();
 video.removeAttribute("src");
 video.load();

 const isMp4 = url.toLowerCase().includes(".mp4") || url.toLowerCase().includes(".mkv") || url.toLowerCase().includes(".avi");
 let finalUrl = url;

 // tenta https para filmes
 if(isMp4 && url.startsWith("http://")){
   finalUrl = url.replace("http://","https://");
 }

 if(isMp4){
   // FILME - direto
   video.src=finalUrl;
   video.play().then(()=>{spinner.style.display="none";}).catch(()=>{
     // se https falhar, tenta http original
     video.src=url;
     video.play().then(()=>{spinner.style.display="none";}).catch(()=>{spinner.style.display="none";});
   });
   video.onerror=()=>{spinner.style.display="none";};
 } else {
   // TV AO VIVO - HLS ultra leve
   const cfg={enableWorker:true,lowLatencyMode:true,backBufferLength:8,maxBufferLength:12,liveSyncDurationCount:1};
   if(Hls.isSupported()){
     hls=new Hls(cfg);
     hls.loadSource(finalUrl);
     hls.attachMedia(video);
     hls.on(Hls.Events.MANIFEST_PARSED,()=>{spinner.style.display="none";video.play();});
     hls.on(Hls.Events.ERROR,(ev,data)=>{if(data.fatal){spinner.style.display="none";video.src=finalUrl;video.play();}});
   } else {
     video.src=finalUrl;
     video.play();
     spinner.style.display="none";
   }
 }
}
function closePlayer(){
 document.getElementById("playerModal").classList.remove("active");
 const v=document.getElementById("video");
 v.pause();v.removeAttribute("src");v.load();
 if(hls){try{hls.destroy()}catch(e){}hls=null;}
 document.getElementById("spinner").style.display="none";
}
function playFirst(){if(filtered.length) play(filtered[0].url,filtered[0].name);}
loadAuto();
</script>
</body>
</html>
