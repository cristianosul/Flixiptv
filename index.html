<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIX - IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--red:#e50914;--bg:#141414;--card:#232323}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica}
body{background:var(--bg);color:#fff}
header{position:fixed;top:0;width:100%;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:linear-gradient(180deg,#000 90%,transparent)}
.logo{color:var(--red);font-weight:900;font-size:30px}
.search input{background:rgba(0,0,0,.7);border:1px solid #555;color:#fff;padding:8px 14px;border-radius:4px;width:240px}
.hero{height:65vh;position:relative;display:flex;align-items:end;padding:0 4% 60px;background-size:cover;background-position:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.8),transparent 85%)}
.hero-content{position:relative;z-index:2;max-width:650px}
.hero h1{font-size:42px;margin-bottom:10px}
.btn{padding:10px 24px;border:none;border-radius:4px;font-weight:700;cursor:pointer}
.btn-play{background:#fff;color:#000}
.rows{margin-top:10px;position:relative;z-index:3}
.row{padding:14px 4%}
.row h2{margin-bottom:12px;font-size:19px}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:10px 0;scroll-behavior:smooth}
.carousel::-webkit-scrollbar{display:none}
.card{min-width:165px;max-width:165px;height:92px;background:var(--card);border-radius:4px;overflow:hidden;cursor:pointer;flex-shrink:0;position:relative;transition:.2s}
.card.movie{min-width:160px;max-width:160px;height:240px}
.card:hover{transform:scale(1.07)}
.card img{width:100%;height:100%;object-fit:cover}
.card .title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#000 80%,transparent);padding:8px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playerModal{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#playerModal.active{display:flex}
.player-top{display:flex;justify-content:space-between;padding:14px 20px;background:#111}
#video{width:100%;height:calc(100vh - 56px);background:#000}
#status{padding:18px 4%;color:#aaa;font-size:14px;background:#1a1a1a}
</style>
</head>
<body>
<header><div class="logo">FLIX</div><div class="search"><input id="searchInput" placeholder="Buscar..." onkeyup="filterAll()"></div></header>
<div class="hero" id="hero" style="background-image:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600)">
<div class="hero-content"><h1 id="heroTitle">Carregando sua lista...</h1><p id
